[project]
name = "mosaicgate"
version = "0.1.0"
description = "Task-grant enforcement and text/image inspection for a simulated MCP agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{name = "Emir Simsek"}]
dependencies = [
  "google-genai",
  "mcp",
  "pillow",
  "pydantic",
  "python-dotenv",
]

[project.scripts]
mosaicgate = "mosaicgate.cli:main"

[dependency-groups]
dev = ["mypy", "pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "examples", "scripts"]
